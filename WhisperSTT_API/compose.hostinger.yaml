# Hostinger VPS Docker stack — PHP API + whisper-server (auto-restart on boot).
#
# Prefer this file when you already cloned the repo on the VPS (local build context):
#   git clone https://github.com/ZakRowton/APIs.git
#   cd APIs/WhisperSTT_API
#   docker compose -f compose.hostinger.yaml up -d --build
#
# Hostinger Docker Manager "Compose from URL" must use docker-compose.yml instead
# (remote Git build context): see that file's header for the raw URL.
# Requires a Hostinger VPS with Docker (not shared PHP-only hosting).

services:
  whisper:
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
    container_name: neuswhisper-whisper
    volumes:
      - whisper_models:/models
    environment:
      WHISPER_MODEL_PATH: /models/${NEUS_WHISPER_MODEL:-ggml-base.en.bin}
      WHISPER_SERVER_HOST: 0.0.0.0
      WHISPER_SERVER_PORT: "8081"
    expose:
      - "8081"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: neuswhisper-web
    ports:
      - "${NEUS_WHISPER_HTTP_PORT:-8934}:8080"
    environment:
      WHISPER_SERVER_HOST: whisper
      WHISPER_SERVER_PORT: "8081"
      WHISPER_SERVER_INFERENCE_PATH: /inference
      NEUS_WHISPER_AUTO_START: "0"
      NEUS_WHISPER_API_KEY: "${NEUS_WHISPER_API_KEY:-}"
      NEUS_WHISPER_MAX_UPLOAD_BYTES: "${NEUS_WHISPER_MAX_UPLOAD_BYTES:-26214400}"
    depends_on:
      - whisper
    restart: unless-stopped

volumes:
  whisper_models:
