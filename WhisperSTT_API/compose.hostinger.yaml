# WhisperSTT_API — local/SSH build after git clone.
# Hostinger Compose-from-URL uses repo-root docker-compose.yaml instead.
#
#   cd APIs/WhisperSTT_API && docker compose -f compose.hostinger.yaml up -d --build
#
# Env auto-set below (optional sibling .env can override NEUS_WHISPER_*).

name: WhisperSTT_API

services:
  whisper:
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
    container_name: WhisperSTT_API-whisper
    volumes:
      - whisperstt_models:/models
    environment:
      WHISPER_MODEL_PATH: /models/${NEUS_WHISPER_MODEL:-ggml-base.en.bin}
      WHISPER_SERVER_HOST: 0.0.0.0
      WHISPER_SERVER_PORT: "8081"
    expose:
      - "8081"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: WhisperSTT_API-api
    ports:
      - "${NEUS_WHISPER_HTTP_PORT:-8934}:8080"
    environment:
      WHISPER_SERVER_HOST: whisper
      WHISPER_SERVER_PORT: "8081"
      WHISPER_SERVER_INFERENCE_PATH: /inference
      WHISPER_MODEL: models/ggml-base.en.bin
      WHISPER_THREADS: "4"
      FFMPEG: ffmpeg
      NEUS_WHISPER_AUTO_START: "0"
      NEUS_WHISPER_MAX_UPLOAD_BYTES: "${NEUS_WHISPER_MAX_UPLOAD_BYTES:-26214400}"
      NEUS_WHISPER_RETRY_ATTEMPTS: "${NEUS_WHISPER_RETRY_ATTEMPTS:-3}"
      NEUS_WHISPER_RETRY_DELAY_MS: "${NEUS_WHISPER_RETRY_DELAY_MS:-500}"
      NEUS_WHISPER_API_KEY: "${NEUS_WHISPER_API_KEY:-}"
    depends_on:
      - whisper
    restart: unless-stopped

volumes:
  whisperstt_models:
