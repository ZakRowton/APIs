# Hostinger Docker Manager — Compose from URL:
#   https://github.com/ZakRowton/APIs
# Project name in UI: WhisperSTT_API
#
# Zero manual env setup — defaults are baked into each service below.

name: WhisperSTT_API

services:
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: WhisperSTT_API-whisper
    volumes:
      - whisperstt_models:/models
    environment:
      WHISPER_MODEL_PATH: /models/ggml-base.en.bin
      WHISPER_SERVER_HOST: 0.0.0.0
      WHISPER_SERVER_PORT: "8081"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        MODEL="$${WHISPER_MODEL_PATH:-/models/ggml-base.en.bin}"
        MODEL_DIR="$$(dirname "$$MODEL")"
        MODEL_FILE="$$(basename "$$MODEL")"
        MODEL_NAME="$${MODEL_FILE#ggml-}"
        MODEL_NAME="$${MODEL_NAME%.bin}"
        mkdir -p "$$MODEL_DIR"
        if [ ! -f "$$MODEL" ]; then
          echo "Downloading whisper model '$$MODEL_NAME' to $$MODEL ..."
          if [ -x ./models/download-ggml-model.sh ]; then
            ./models/download-ggml-model.sh "$$MODEL_NAME" "$$MODEL_DIR"
          else
            wget -O "$$MODEL" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$$MODEL_FILE" \
              || curl -fsSL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$$MODEL_FILE" -o "$$MODEL"
          fi
        fi
        exec whisper-server --host "$${WHISPER_SERVER_HOST:-0.0.0.0}" --port "$${WHISPER_SERVER_PORT:-8081}" -m "$$MODEL" --convert
    expose:
      - "8081"
    restart: unless-stopped

  api:
    image: php:8.2-apache-bookworm
    container_name: WhisperSTT_API-api
    ports:
      - "8934:8080"
    environment:
      WHISPER_SERVER_HOST: whisper
      WHISPER_SERVER_PORT: "8081"
      WHISPER_SERVER_INFERENCE_PATH: /inference
      WHISPER_MODEL: models/ggml-base.en.bin
      WHISPER_THREADS: "4"
      FFMPEG: ffmpeg
      NEUS_WHISPER_AUTO_START: "0"
      NEUS_WHISPER_MAX_UPLOAD_BYTES: "26214400"
      NEUS_WHISPER_RETRY_ATTEMPTS: "3"
      NEUS_WHISPER_RETRY_DELAY_MS: "500"
      NEUS_WHISPER_API_KEY: ""
    volumes:
      - whisperstt_api:/var/www/html
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        if ! command -v curl >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
        fi
        curl -fsSL https://raw.githubusercontent.com/ZakRowton/APIs/main/WhisperSTT_API/docker/hostinger-bootstrap.sh -o /tmp/hostinger-bootstrap.sh
        chmod +x /tmp/hostinger-bootstrap.sh
        exec /tmp/hostinger-bootstrap.sh
    depends_on:
      - whisper
    restart: unless-stopped

volumes:
  whisperstt_models:
  whisperstt_api:
