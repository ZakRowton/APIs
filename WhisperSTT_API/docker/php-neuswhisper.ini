; NeusWhisper PHP overrides — long recordings (10+ min audio) upload multi-MB
; webm blobs and the whisper-server backend can take several minutes to answer.
; PHP's compiled defaults (2M uploads / 8M POST / 60s input parse / 30s exec)
; reject or cut off those requests before transcribe.php ever runs.
upload_max_filesize = 32M
post_max_size = 36M
max_input_time = 660
max_execution_time = 660
memory_limit = 256M
